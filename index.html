<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Is Bizi Live?</title>
<link rel="icon" type="image/png" href="https://cdn.discordapp.com/guilds/1261689619322372199/users/593921296224747521/avatars/5f5bf02c4bae4e55c0ad12d2c5051528.png?size=1024">
<meta property="og:title" content="Is Bizi Live?">
<meta property="og:description" content="Check if bizi4l is currently live on Twitch.">
<meta property="og:image" content="https://cdn.discordapp.com/guilds/1261689619322372199/users/593921296224747521/avatars/5f5bf02c4bae4e55c0ad12d2c5051528.png?size=1024">
<meta name="theme-color" content="#38e2bd">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Sora:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1: #17122b;
    --bg-2: #2a1a4d;
    --glass: rgba(255,255,255,0.055);
    --glass-border: rgba(255,255,255,0.10);
    --text: #f3f1fb;
    --mute: #b3aad0;
    --live: #38e2bd;
    --live-dim: rgba(56,226,189,0.18);
    --off: #7d76a3;
    --off-dim: rgba(125,118,163,0.16);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:'Sora', sans-serif;
    color: var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    background:
      radial-gradient(1100px 700px at 15% -10%, rgba(120,90,220,0.35), transparent 60%),
      radial-gradient(900px 600px at 110% 110%, rgba(56,226,189,0.12), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed;
    position:relative;
    overflow:hidden;
  }

  .card{
    width:100%;
    max-width: 420px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 22px;
    padding: 44px 36px 36px;
    text-align:center;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55);
    position:relative;
    z-index:1;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--mute);
    margin: 0 0 26px;
  }

  .badge{
    position:relative;
    width: 92px;
    height: 92px;
    margin: 0 auto 26px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border: 1.5px solid var(--off);
    opacity:.55;
  }
  .ring.r2{ inset:-10px; opacity:.25; }
  .dot{
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--off);
    transition: background .4s ease;
  }

  .badge.live .ring{ border-color: var(--live); }
  .badge.live .dot{ background: var(--live); box-shadow: 0 0 16px 2px var(--live-dim); }
  .badge.live .ring.r1{ animation: pulse 2.4s ease-out infinite; }
  .badge.live .ring.r2{ animation: pulse 2.4s ease-out infinite .6s; }

  @keyframes pulse{
    0%   { transform: scale(0.85); opacity:.55; }
    80%  { transform: scale(1.55); opacity:0; }
    100% { transform: scale(1.55); opacity:0; }
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
    transition: color .3s ease;
  }
  h1.live{ color: var(--live); }
  h1.off{ color: var(--text); }

  p.sub{
    font-size: 14.5px;
    line-height:1.55;
    color: var(--mute);
    margin: 0 0 30px;
    min-height: 22px;
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding: 14px 28px;
    border-radius: 12px;
    text-decoration:none;
    font-family:'Sora', sans-serif;
    font-weight:600;
    font-size: 14.5px;
    color: #14102a;
    background: var(--off);
    transition: transform .18s ease, background .3s ease, box-shadow .3s ease;
  }
  .cta:hover{ transform: translateY(-2px); }
  .cta.live{
    background: var(--live);
    box-shadow: 0 10px 30px -8px var(--live-dim);
  }
  .cta.live:hover{ box-shadow: 0 14px 34px -6px rgba(56,226,189,0.4); }
  .cta svg{ width:15px; height:15px; }

  .player-wrap{
    margin-top: 22px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--glass-border);
    max-height: 0;
    opacity: 0;
    transform: translateY(6px);
    transition: max-height .45s ease, opacity .35s ease, transform .35s ease, margin-top .45s ease;
  }
  .player-wrap.show{
    max-height: 260px;
    opacity: 1;
    transform: translateY(0);
  }
  .player-wrap iframe{
    display:block;
    width: 100%;
    height: 240px;
    border: none;
  }

  .meta{
    margin-top: 22px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: .06em;
    color: rgba(179,170,208,0.55);
  }

  .clock{
    margin-top: 8px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: .08em;
    color: var(--mute);
  }

  @media (prefers-reduced-motion: reduce){
    .badge.live .ring{ animation:none; }
  }

  #fx-canvas{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }

  .settings-btn{
    position:fixed;
    bottom:20px;
    right:20px;
    width:46px;
    height:46px;
    border-radius:50%;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:5;
    color: var(--text);
    font-size:18px;
    transition: transform .3s ease, background .2s ease;
  }
  .settings-btn:hover{ transform: rotate(45deg); }

  .panel{
    position:fixed;
    bottom:76px;
    right:20px;
    width:270px;
    max-width: calc(100vw - 40px);
    background: rgba(23,18,43,0.85);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 18px;
    padding: 22px;
    z-index:5;
    opacity:0;
    transform: translateY(10px);
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .panel.open{ opacity:1; transform:translateY(0); pointer-events:auto; }

  .panel h3{
    margin: 0 0 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--mute);
  }

  .seg{ display:flex; gap:6px; margin-bottom:18px; }
  .seg button{
    flex:1;
    padding: 8px 0;
    border-radius: 8px;
    border: 1px solid var(--glass-border);
    background: transparent;
    color: var(--mute);
    font-family:'Sora', sans-serif;
    font-size: 12px;
    cursor:pointer;
    transition: background .2s ease, color .2s ease, border-color .2s ease;
  }
  .seg button.active{ background: var(--off); color:#14102a; border-color: var(--off); }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
  }
  .row label{ font-size:12px; color: var(--mute); }
  .row input[type=range]{ flex:1; accent-color: var(--live); }
  .row input[type=color]{
    width:34px; height:26px; border:none; border-radius:6px;
    background:none; padding:0; cursor:pointer;
  }

  .bg-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
  }
  .bg-swatch{ text-align:center; cursor:pointer; }
  .bg-swatch .chip{
    width:100%;
    aspect-ratio:1;
    border-radius:9px;
    border: 1.5px solid transparent;
    transition: border-color .2s ease, transform .15s ease;
  }
  .bg-swatch:hover .chip{ transform: scale(1.05); }
  .bg-swatch.active .chip{ border-color: var(--live); }
  .bg-swatch span{
    display:block;
    margin-top:5px;
    font-size:9px;
    color: var(--mute);
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:.03em;
  }

  .islider-wrap{ margin-bottom:18px; }
  .islider-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .islider-head label{ font-size:12px; color: var(--mute); }
  .islider-value{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--live);
    min-width: 28px;
    text-align:right;
    transition: color .2s ease;
  }

  .islider{
    position:relative;
    height: 30px;
    display:flex;
    align-items:center;
    cursor:pointer;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  .islider:focus-visible .ithumb{
    box-shadow: 0 0 0 3px rgba(56,226,189,0.45), 0 2px 8px rgba(0,0,0,.4);
  }
  .itrack{
    position:relative;
    width:100%;
    height:6px;
    border-radius:999px;
    background: rgba(255,255,255,0.08);
    overflow:visible;
  }
  .iticks{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 0 1px;
    pointer-events:none;
  }
  .iticks span{
    width:2px; height:2px;
    border-radius:50%;
    background: rgba(255,255,255,0.18);
  }
  .ifill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:40%;
    border-radius:999px;
    background: linear-gradient(90deg, var(--off), var(--live));
    transition: width .18s cubic-bezier(.22,1,.36,1);
  }
  .ithumb{
    position:absolute;
    top:50%;
    left:40%;
    width:18px; height:18px;
    border-radius:50%;
    background: var(--text);
    box-shadow: 0 2px 8px rgba(0,0,0,.4), 0 0 0 4px rgba(56,226,189,0.12);
    transform: translate(-50%,-50%);
    transition: left .18s cubic-bezier(.22,1,.36,1), transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
  }
  .islider:hover .ithumb{ box-shadow: 0 2px 10px rgba(0,0,0,.45), 0 0 0 6px rgba(56,226,189,0.16); }
  .islider.dragging .ifill,
  .islider.dragging .ithumb{ transition: box-shadow .2s ease, transform .12s ease; }
  .islider.dragging .ithumb{
    transform: translate(-50%,-50%) scale(1.3);
    box-shadow: 0 4px 16px rgba(0,0,0,.5), 0 0 0 9px rgba(56,226,189,0.22);
  }
  .islider.pop .ithumb{ animation: ithumb-pop .38s cubic-bezier(.34,1.56,.64,1); }
  @keyframes ithumb-pop{
    0%{ transform: translate(-50%,-50%) scale(1.3); }
    50%{ transform: translate(-50%,-50%) scale(0.88); }
    100%{ transform: translate(-50%,-50%) scale(1); }
  }

  .itooltip{
    position:absolute;
    bottom: 24px;
    left:40%;
    transform: translateX(-50%) translateY(4px) scale(.85);
    background: rgba(20,16,42,0.95);
    border: 1px solid var(--glass-border);
    padding: 3px 8px;
    border-radius:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color: var(--text);
    opacity:0;
    transition: left .18s cubic-bezier(.22,1,.36,1), opacity .15s ease, transform .15s ease;
    pointer-events:none;
    white-space:nowrap;
  }
  .islider:hover .itooltip,
  .islider.dragging .itooltip{
    opacity:1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
  .islider.dragging .itooltip{ transition: opacity .15s ease, transform .15s ease; }

  @media (prefers-reduced-motion: reduce){
    .ifill, .ithumb, .itooltip{ transition-duration: .01s !important; }
    .islider.pop .ithumb{ animation:none; }
  }

</style>
</head>
<body>

<canvas id="fx-canvas"></canvas>

<div class="card">
  <p class="eyebrow">twitch · bizi4l</p>

  <div class="badge" id="badge">
    <div class="ring r2"></div>
    <div class="ring r1"></div>
    <div class="dot"></div>
  </div>

  <h1 id="heading" class="off">checking…</h1>
  <p class="sub" id="sub">Give me a second to check the signal.</p>

  <a class="cta" id="cta" href="https://twitch.tv/bizi4l" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 2l-2 4v14h6v2h4l3-3h5l4-5V2H4z" fill="currentColor"/></svg>
    <span id="ctaText">Go to Twitch</span>
  </a>

  <div class="player-wrap" id="playerWrap">
    <div id="twitch-embed"></div>
  </div>

  <p class="meta" id="meta">refreshes every 60s</p>
  <p class="clock" id="clock">--:--:--</p>
</div>

<button class="settings-btn" id="settingsBtn" title="Appearance settings" aria-label="Appearance settings">✦</button>

<div class="panel" id="panel">
  <h3>Effect</h3>
  <div class="seg" id="effectSeg">
    <button data-effect="none">None</button>
    <button data-effect="dots">Dots</button>
    <button data-effect="rain">Rain</button>
  </div>

  <div class="row">
    <label for="fxColor">Colour</label>
    <input type="color" id="fxColor" value="#38e2bd">
  </div>

  <div class="islider-wrap">
    <div class="islider-head">
      <label>Intensity</label>
      <span class="islider-value" id="islValue">40</span>
    </div>
    <div class="islider" id="islider" tabindex="0" role="slider" aria-label="Intensity" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40">
      <div class="itrack">
        <div class="iticks">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="ifill" id="islFill"></div>
      </div>
      <div class="ithumb" id="islThumb"></div>
      <div class="itooltip" id="islTooltip">40</div>
    </div>
  </div>

  <h3 style="margin-top:22px;">Background</h3>
  <div class="bg-grid" id="bgGrid"></div>
</div>

<script>
  const CHANNEL = "bizi4l";
  const POLL_MS = 60000;

  const badge = document.getElementById('badge');
  const heading = document.getElementById('heading');
  const sub = document.getElementById('sub');
  const cta = document.getElementById('cta');
  const ctaText = document.getElementById('ctaText');
  const meta = document.getElementById('meta');
  const playerWrap = document.getElementById('playerWrap');
  const embedContainer = document.getElementById('twitch-embed');

  // If you add a custom domain later, add it here (or replace this entirely).
  const PLAYER_PARENT = window.location.hostname;

  let playerLoaded = false;
  function showPlayer(){
    if(!playerLoaded){
      const iframe = document.createElement('iframe');
      iframe.src = `https://player.twitch.tv/?channel=${CHANNEL}&parent=${PLAYER_PARENT}&muted=true`;
      iframe.allowFullscreen = true;
      embedContainer.appendChild(iframe);
      playerLoaded = true;
    }
    playerWrap.classList.add('show');
  }
  function hidePlayer(){
    playerWrap.classList.remove('show');
    if(playerLoaded){
      embedContainer.innerHTML = '';
      playerLoaded = false;
    }
  }

  function setLive(isLive){
    badge.classList.toggle('live', isLive);
    if(isLive){ showPlayer(); } else { hidePlayer(); }
    if(isLive){
      heading.textContent = 'Is Bizi Live?';
      heading.className = 'live';
      sub.textContent = "Bizi is live right now, come say hi!";
      cta.classList.add('live');
      ctaText.textContent = 'Watch Live';
    } else {
      heading.textContent = 'Is Bizi Live?';
      heading.className = 'off';
      sub.textContent = "Bizi is not streaming at the moment. Follow so you watch the next one.";
      cta.classList.remove('live');
      ctaText.textContent = 'Go to Twitch';
    }
    meta.textContent = 'last checked ' + new Date().toLocaleTimeString();
  }

  async function checkStatus(){
    try{
      const res = await fetch(`https://decapi.me/twitch/uptime/${CHANNEL}`, { cache: "no-store" });
      const text = (await res.text()).trim().toLowerCase();
      setLive(!text.includes('offline'));
    } catch (err){
      sub.textContent = "Couldn't reach the signal check — retrying shortly…";
    }
  }

  const clock = document.getElementById('clock');
  function updateClock(){
    clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute:'2-digit', second:'2-digit' });
  }
  updateClock();
  setInterval(updateClock, 1000);

  checkStatus();
  setInterval(checkStatus, POLL_MS);

  const bgPresets = [
    { name: "Default", css: "radial-gradient(1100px 700px at 15% -10%, rgba(120,90,220,0.35), transparent 60%), radial-gradient(900px 600px at 110% 110%, rgba(56,226,189,0.12), transparent 55%), linear-gradient(160deg, #17122b, #2a1a4d)" },
    { name: "Aurora",  css: "radial-gradient(1000px 650px at 20% -10%, rgba(56,226,189,0.30), transparent 60%), radial-gradient(900px 600px at 100% 100%, rgba(90,140,255,0.20), transparent 55%), linear-gradient(160deg, #0d1f24, #123a3a)" },
    { name: "Ember",   css: "radial-gradient(1000px 650px at 15% -10%, rgba(255,120,90,0.28), transparent 60%), radial-gradient(900px 600px at 110% 110%, rgba(230,80,140,0.16), transparent 55%), linear-gradient(160deg, #241226, #3d1a2a)" },
    { name: "Violet",  css: "radial-gradient(1000px 650px at 15% -10%, rgba(180,80,230,0.32), transparent 60%), radial-gradient(900px 600px at 110% 110%, rgba(120,60,220,0.18), transparent 55%), linear-gradient(160deg, #1a1030, #35155a)" },
    { name: "Midnight",css: "radial-gradient(1000px 650px at 15% -10%, rgba(70,120,255,0.28), transparent 60%), radial-gradient(900px 600px at 110% 110%, rgba(56,226,189,0.14), transparent 55%), linear-gradient(160deg, #0b1226, #142449)" },
    { name: "Rose",    css: "radial-gradient(1000px 650px at 15% -10%, rgba(255,110,170,0.28), transparent 60%), radial-gradient(900px 600px at 110% 110%, rgba(255,180,90,0.14), transparent 55%), linear-gradient(160deg, #240f22, #401a3a)" }
  ];

  function applyBackground(name){
    const preset = bgPresets.find(p => p.name === name) || bgPresets[0];
    document.body.style.background = preset.css;
    document.body.style.backgroundAttachment = 'fixed';
  }

  const bgGrid = document.getElementById('bgGrid');
  bgPresets.forEach(preset => {
    const el = document.createElement('div');
    el.className = 'bg-swatch';
    el.dataset.name = preset.name;
    el.innerHTML = `<div class="chip" style="background:${preset.css}"></div><span>${preset.name}</span>`;
    el.addEventListener('click', () => {
      applyBackground(preset.name);
      document.querySelectorAll('.bg-swatch').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      localStorage.setItem('bizi4l-bg', preset.name);
    });
    bgGrid.appendChild(el);
  });

  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d');
  function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const fx = { effect: 'none', color: '#38e2bd', intensity: 40 };
  let particles = [];

  function hexToRgb(hex){
    const m = hex.replace('#','').match(/.{1,2}/g);
    return m.map(h => parseInt(h, 16));
  }

  function spawnParticle(randomY){
    if(fx.effect === 'rain'){
      return {
        x: Math.random() * canvas.width,
        y: randomY ? Math.random() * canvas.height : -20,
        len: 10 + Math.random() * 14,
        speed: 3 + Math.random() * 3,
        opacity: 0.2 + Math.random() * 0.4
      };
    }
    return {
      x: Math.random() * canvas.width,
      y: randomY ? Math.random() * canvas.height : -10,
      r: 1 + Math.random() * 2.2,
      speed: 0.4 + Math.random() * 1.1,
      drift: (Math.random() - 0.5) * 0.6,
      opacity: 0.3 + Math.random() * 0.6
    };
  }

  function makeParticles(){
    const base = Number(fx.intensity);
    const count = Math.round(fx.effect === 'rain' ? base * 1.5 : base);
    particles = Array.from({ length: count }, () => spawnParticle(true));
  }

  function animate(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(fx.effect !== 'none'){
      const [r, g, b] = hexToRgb(fx.color);
      particles.forEach(p => {
        if(fx.effect === 'rain'){
          ctx.strokeStyle = `rgba(${r},${g},${b},${p.opacity})`;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - 2, p.y + p.len);
          ctx.stroke();
          p.y += p.speed;
          p.x -= 0.6;
          if(p.y > canvas.height){ p.y = -20; p.x = Math.random() * canvas.width; }
        } else {
          ctx.fillStyle = `rgba(${r},${g},${b},${p.opacity})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          p.y += p.speed;
          p.x += p.drift;
          if(p.y > canvas.height + 10){ p.y = -10; p.x = Math.random() * canvas.width; }
        }
      });
    }
    requestAnimationFrame(animate);
  }
  animate();

  const settingsBtn = document.getElementById('settingsBtn');
  const panel = document.getElementById('panel');
  settingsBtn.addEventListener('click', () => panel.classList.toggle('open'));
  document.addEventListener('click', (e) => {
    if(!panel.contains(e.target) && e.target !== settingsBtn && panel.classList.contains('open')){
      panel.classList.remove('open');
    }
  });

  const effectSeg = document.getElementById('effectSeg');
  const fxColorInput = document.getElementById('fxColor');

  effectSeg.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      fx.effect = btn.dataset.effect;
      effectSeg.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      makeParticles();
      localStorage.setItem('bizi4l-effect', fx.effect);
    });
  });

  fxColorInput.addEventListener('input', () => {
    fx.color = fxColorInput.value;
    localStorage.setItem('bizi4l-color', fx.color);
  });

  const islider = document.getElementById('islider');
  const islFill = document.getElementById('islFill');
  const islThumb = document.getElementById('islThumb');
  const islTooltip = document.getElementById('islTooltip');
  const islValue = document.getElementById('islValue');

  function setIntensityUI(val, animatePop){
    const pct = Math.max(0, Math.min(100, val));
    islFill.style.width = pct + '%';
    islThumb.style.left = pct + '%';
    islTooltip.style.left = pct + '%';
    islTooltip.textContent = Math.round(pct);
    islValue.textContent = Math.round(pct);
    islider.setAttribute('aria-valuenow', Math.round(pct));
    if(animatePop){
      islider.classList.remove('pop');
      void islider.offsetWidth; // restart animation
      islider.classList.add('pop');
    }
  }

  function commitIntensity(val, animatePop){
    fx.intensity = Math.round(val);
    setIntensityUI(fx.intensity, animatePop);
    makeParticles();
    localStorage.setItem('bizi4l-intensity', fx.intensity);
  }

  function valueFromClientX(clientX){
    const rect = islider.getBoundingClientRect();
    const ratio = (clientX - rect.left) / rect.width;
    return Math.max(0, Math.min(100, ratio * 100));
  }

  let dragging = false;

  islider.addEventListener('pointerdown', (e) => {
    dragging = true;
    islider.classList.add('dragging');
    islider.setPointerCapture(e.pointerId);
    commitIntensity(valueFromClientX(e.clientX), false);
  });
  islider.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    commitIntensity(valueFromClientX(e.clientX), false);
  });
  function endDrag(e){
    if(!dragging) return;
    dragging = false;
    islider.classList.remove('dragging');
    setIntensityUI(fx.intensity, true);
  }
  islider.addEventListener('pointerup', endDrag);
  islider.addEventListener('pointercancel', endDrag);

  islider.addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 10 : 2;
    if(e.key === 'ArrowRight' || e.key === 'ArrowUp'){ commitIntensity(fx.intensity + step, true); e.preventDefault(); }
    if(e.key === 'ArrowLeft' || e.key === 'ArrowDown'){ commitIntensity(fx.intensity - step, true); e.preventDefault(); }
    if(e.key === 'Home'){ commitIntensity(0, true); e.preventDefault(); }
    if(e.key === 'End'){ commitIntensity(100, true); e.preventDefault(); }
  });

  (function loadPrefs(){
    const savedEffect = localStorage.getItem('bizi4l-effect') || 'none';
    const savedColor = localStorage.getItem('bizi4l-color') || '#38e2bd';
    const savedIntensity = localStorage.getItem('bizi4l-intensity') || '40';
    const savedBg = localStorage.getItem('bizi4l-bg') || 'Default';

    fx.effect = savedEffect;
    fx.color = savedColor;
    fx.intensity = Number(savedIntensity);

    fxColorInput.value = savedColor;
    setIntensityUI(fx.intensity, false);
    effectSeg.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.effect === savedEffect));

    applyBackground(savedBg);
    document.querySelectorAll('.bg-swatch').forEach(s => s.classList.toggle('active', s.dataset.name === savedBg));

    makeParticles();
  })();

</script>

</body>
</html>
